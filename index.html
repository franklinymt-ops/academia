        { id:"03-01", title:"ChatGPT para tu negocio desde cero",       duration:"30:00", videoId:"dQw4w9WgXcQ" },
        { id:"03-02", title:"Claude: el asistente más poderoso",        duration:"25:00", videoId:"dQw4w9WgXcQ" },
        { id:"03-03", title:"Gemini y herramientas de Google",          duration:"18:00", videoId:"dQw4w9WgXcQ" },
        { id:"03-04", title:"Creación de prompts que venden",           duration:"35:00", videoId:"dQw4w9WgXcQ" },
        { id:"03-05", title:"Automatización de tareas repetitivas",     duration:"28:00", videoId:"dQw4w9WgXcQ" }
      ]
    },
    {
      id:4, num:"04", title:"Marketing Digital", sub:"Atrae clientes todos los días",
      icon:"ti-speakerphone",
      lessons:[
        { id:"04-01", title:"Facebook Ads desde cero",              duration:"40:00", videoId:"dQw4w9WgXcQ" },
        { id:"04-02", title:"Contenido orgánico que convierte",     duration:"22:00", videoId:"dQw4w9WgXcQ" },
        { id:"04-03", title:"Embudos de venta simples",             duration:"30:00", videoId:"dQw4w9WgXcQ" },

    },

      icon:"ti-truck",
      lessons:[
        { id:"05-01", title:"Investigación de productos ganadores",         duration:"35:00", videoId:"dQw4w9WgXcQ" },
        { id:"05-02", title:"Proveedores confiables y cómo contactarlos",   duration:"20:00", videoId:"dQw4w9WgXcQ" },
        { id:"05-03", title:"Páginas de venta de alta conversión",          duration:"45:00", videoId:"dQw4w9WgXcQ" },
        { id:"05-04", title:"Escalado y optimización",                      duration:"30:00", videoId:"dQw4w9WgXcQ" }
      ]
    },
    {
      id:6, num:"06", title:"Automatizaciones", sub:"Tu negocio trabaja solo",
      icon:"ti-settings-automation",
      lessons:[
        { id:"06-01", title:"Automatizar WhatsApp Business",        duration:"25:00", videoId:"dQw4w9WgXcQ" },
        { id:"06-02", title:"Formularios y captura de leads",       duration:"18:00", videoId:"dQw4w9WgXcQ" },
        { id:"06-03", title:"CRM básico gratuito",                  duration:"22:00", videoId:"dQw4w9WgXcQ" },
        { id:"06-04", title:"Seguimientos automáticos",             duration:"20:00", videoId:"dQw4w9WgXcQ" }
      ]
    }
  ];

  // ── Estado global ───────────────────────────────────────────
  let STATE = {
    user: null,
    userData: null,
    currentView: "home",
    currentModule: null,
    currentLesson: null,
    plan: "free"
  };

  // ── Auth listener ───────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    STATE.user = user;
    if (user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        STATE.userData = snap.data();
        STATE.plan = snap.data().plan || "free";
      } else {
        // Nuevo usuario — crear documento
        const newUser = {
          uid: user.uid, email: user.email,
          name: user.displayName || user.email.split("@")[0],
          plan: "free", progress: {}, createdAt: serverTimestamp()
        };
        await setDoc(doc(db, "users", user.uid), newUser);
        STATE.userData = newUser;
        STATE.plan = "free";
      }
      render("dashboard");
    } else {
      STATE.userData = null;
      STATE.plan = "free";
      render("home");
    }
  });

  // ── Guardar progreso ────────────────────────────────────────
  async function markLesson(lessonId) {
    if (!STATE.user) return;
    const path = `progress.${lessonId}`;
    await updateDoc(doc(db, "users", STATE.user.uid), {
      [path]: true, lastActive: serverTimestamp()
    });
    if (!STATE.userData.progress) STATE.userData.progress = {};
    STATE.userData.progress[lessonId] = true;
    renderProgress();
  }

  // ── Calcular progreso por módulo ────────────────────────────
  function moduleProgress(mod) {
    if (!STATE.userData?.progress) return 0;
    const done = mod.lessons.filter(l => STATE.userData.progress[l.id]).length;
    return Math.round((done / mod.lessons.length) * 100);
  }

  // ── Verificar acceso ────────────────────────────────────────
  function canAccess(moduleId) {
    const plan = PLANS[STATE.plan];
    return plan && plan.modules.includes(moduleId);
  }

  // ── AUTH FORMS ──────────────────────────────────────────────
  async function doLogin() {
    const email = document.getElementById("auth-email").value;
    const pass  = document.getElementById("auth-pass").value;
    setAuthMsg("Iniciando sesión...", "info");
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      setAuthMsg(getAuthError(e.code), "error");
    }
  }

  async function doRegister() {
    const name  = document.getElementById("auth-name").value;
    const email = document.getElementById("auth-email").value;
    const pass  = document.getElementById("auth-pass").value;
    if (!name || !email || !pass) { setAuthMsg("Completa todos los campos", "error"); return; }
    if (pass.length < 6) { setAuthMsg("La contraseña debe tener mínimo 6 caracteres", "error"); return; }
    setAuthMsg("Creando tu cuenta...", "info");
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
    } catch(e) {
      setAuthMsg(getAuthError(e.code), "error");
    }
  }

  async function doLogout() {
    await signOut(auth);
  }

  function setAuthMsg(msg, type) {
    const el = document.getElementById("auth-msg");
    if (!el) return;
    el.textContent = msg;
    el.className = "auth-msg " + type;
  }

  function getAuthError(code) {
    const map = {
      "auth/invalid-email":          "Correo inválido",
      "auth/user-not-found":         "Usuario no encontrado",
      "auth/wrong-password":         "Contraseña incorrecta",
      "auth/email-already-in-use":   "Este correo ya está registrado",
      "auth/weak-password":          "La contraseña es muy débil",
      "auth/invalid-credential":     "Correo o contraseña incorrectos"
    };
    return map[code] || "Error: " + code;
  }

  // ── RENDER ENGINE ───────────────────────────────────────────
  function render(view) {
    STATE.currentView = view;
    const app = document.getElementById("app");
    app.innerHTML = buildNav() + buildView(view);
    attachEvents();
  }

  function buildNav() {
    const user = STATE.user;
    const planName = user ? (PLANS[STATE.plan]?.name || "Free") : "";
    return `
    <nav>
      <div class="logo" onclick="goHome()">
        <div class="logo-badge">FM</div>
        <div class="logo-text">Franklin<span>IA & Emprendimientos</span></div>
      </div>
      <div class="nav-links">
        <span class="nav-link ${STATE.currentView==='home'||STATE.currentView==='courses'?'active':''}" onclick="render('courses')">Cursos</span>
        ${user ? `<span class="nav-link ${STATE.currentView==='dashboard'?'active':''}" onclick="render('dashboard')">Mi Progreso</span>` : ""}
        <span class="nav-link ${STATE.currentView==='pricing'?'active':''}" onclick="render('pricing')">Planes</span>
      </div>
      <div class="nav-right">
        ${user
          ? `<span class="nav-user"><i class="ti ti-user-circle"></i> ${STATE.userData?.name || user.email} <span class="plan-badge">${planName}</span></span>
             <button class="btn-ghost" onclick="doLogout()"><i class="ti ti-logout"></i></button>`
          : `<button class="btn-nav" onclick="render('login')">Ingresar</button>`
        }
      </div>
    </nav>`;
  }

  function buildView(view) {
    switch(view) {
      case "home":     return buildHome();
      case "courses":  return buildCourses();
      case "dashboard":return buildDashboard();
      case "pricing":  return buildPricing();
      case "login":    return buildAuth("login");
      case "register": return buildAuth("register");
      case "player":   return buildPlayer();
      default:         return buildHome();
    }
  }

  // ── HOME ────────────────────────────────────────────────────
  function buildHome() {
    const totalLessons = MODULES.reduce((s,m) => s + m.lessons.length, 0);
    return `
    <div class="hero">
      <div class="hero-content">
        <div class="hero-tag"><i class="ti ti-sparkles"></i> Academia Online · Medellín, Colombia</div>
        <h1>Aprende a Vender<br>con <span class="gold">IA & Digital</span></h1>
        <p>Domina WhatsApp Business, inteligencia artificial y marketing digital para multiplicar tus ingresos. Formación 100% práctica para emprendedores latinos.</p>
        <div class="hero-cta">
          <button class="btn-primary btn-lg" onclick="render('courses')">Ver cursos <i class="ti ti-arrow-right"></i></button>
          <button class="btn-outline btn-lg" onclick="render('pricing')">Ver precios</button>
        </div>
        <div class="hero-stats">
          <div class="h-stat"><strong>${MODULES.length}</strong><span>Módulos</span></div>
          <div class="h-divider"></div>
          <div class="h-stat"><strong>${totalLessons}</strong><span>Lecciones</span></div>
          <div class="h-divider"></div>
          <div class="h-stat"><strong>4</strong><span>Niveles</span></div>
          <div class="h-divider"></div>
          <div class="h-stat"><strong>100%</strong><span>Práctico</span></div>
        </div>
      </div>
      <div class="hero-visual">
        <div class="hero-card">
          <div class="hc-top">
            <div class="hc-avatar">FM</div>
            <div><div class="hc-name">Franklin Morán</div><div class="hc-role">Instructor Principal</div></div>
          </div>
          <div class="hc-modules">
            ${MODULES.slice(1,5).map(m=>`
            <div class="hc-mod">
              <i class="ti ${m.icon}"></i>
              <span>${m.title}</span>
              <span class="hc-count">${m.lessons.length} lec</span>
            </div>`).join("")}
          </div>
          <button class="btn-primary" style="width:100%;margin-top:1rem" onclick="render(${STATE.user?`'courses'`:`'register'`})">
            ${STATE.user ? "Ir a mis cursos" : "Registrarse gratis"} <i class="ti ti-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="section-wrap">
      <div class="section-label">LO QUE VAS A LOGRAR</div>
      <div class="outcomes-grid">
        ${[
          ["ti-brand-whatsapp","Vender por WhatsApp","Guiones, seguimientos y cierres de venta profesionales"],
          ["ti-robot","Automatizar con IA","Usa ChatGPT, Claude y Gemini para tu negocio diario"],
          ["ti-cash","Generar ingresos online","Dropshipping, cursos y servicios digitales desde cero"],
          ["ti-speakerphone","Marketing que funciona","Ads, contenido orgánico y embudos de conversión"],
        ].map(([icon,title,desc])=>`
        <div class="outcome-card">
          <div class="oc-icon"><i class="ti ${icon}"></i></div>
          <div class="oc-title">${title}</div>
          <div class="oc-desc">${desc}</div>
        </div>`).join("")}
      </div>
    </div>`;
  }

  // ── COURSES ─────────────────────────────────────────────────
  function buildCourses() {
    const totalDone = STATE.userData
      ? MODULES.reduce((s,m) => s + m.lessons.filter(l => STATE.userData.progress?.[l.id]).length, 0)
      : 0;
    const totalLessons = MODULES.reduce((s,m) => s + m.lessons.length, 0);

    return `
    <div class="page-header">
      <div>
        <h2>Programa Completo</h2>
        <p class="page-sub">${totalLessons} lecciones · ${MODULES.length} módulos · Actualizado 2025</p>
      </div>
      ${STATE.user
        ? `<div class="global-progress">
             <span>${totalDone} / ${totalLessons} completadas</span>
             <div class="progress-bar big"><div class="progress-fill" style="width:${Math.round(totalDone/totalLessons*100)}%"></div></div>
           </div>`
        : `<button class="btn-primary" onclick="render('register')">Inscribirme gratis <i class="ti ti-arrow-right"></i></button>`
      }
    </div>
    <div class="modules-list">
      ${MODULES.map(mod => buildModuleRow(mod)).join("")}
    </div>`;
  }

  function buildModuleRow(mod) {
    const locked   = !canAccess(mod.id);
    const prog     = moduleProgress(mod);
    const doneLess = STATE.userData ? mod.lessons.filter(l => STATE.userData.progress?.[l.id]).length : 0;

    return `
    <div class="module-row ${locked?'locked':''}">
      <div class="mod-header" onclick="toggleModule(${mod.id})">
        <div class="mod-icon-wrap ${locked?'locked':''}">
          <i class="ti ${locked?'ti-lock':mod.icon}"></i>
        </div>
        <div class="mod-info">
          <div class="mod-num">MÓDULO ${mod.num}</div>
          <div class="mod-title">${mod.title}</div>
          <div class="mod-sub">${mod.sub} · ${mod.lessons.length} lecciones</div>
        </div>
        <div class="mod-right">
          ${!locked && STATE.user
            ? `<div class="mod-prog">
                 <span class="prog-text">${doneLess}/${mod.lessons.length}</span>
                 <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
               </div>`
            : locked
              ? `<span class="lock-label"><i class="ti ti-lock"></i> Requiere plan</span>`
              : ''
          }
          <i class="ti ti-chevron-down mod-chevron" id="chev-${mod.id}"></i>
        </div>
      </div>
      <div class="mod-lessons" id="lessons-${mod.id}" style="display:none">
        ${mod.lessons.map(l => buildLessonRow(l, mod.id, locked)).join("")}
      </div>
    </div>`;
  }

  function buildLessonRow(lesson, modId, locked) {
    const done = STATE.userData?.progress?.[lesson.id];
    return `
    <div class="lesson-row ${locked?'locked':''} ${done?'done':''}"
         onclick="${locked ? `showUpgradeMsg()` : `openLesson(${modId},'${lesson.id}')`}">
      <div class="lesson-icon">
        <i class="ti ${done?'ti-circle-check':locked?'ti-lock':'ti-player-play'}"></i>
      </div>
      <span class="lesson-title">${lesson.title}</span>
      <span class="lesson-dur"><i class="ti ti-clock"></i> ${lesson.duration}</span>
    </div>`;
  }

  // ── PLAYER ──────────────────────────────────────────────────
  function buildPlayer() {
    const mod    = STATE.currentModule;
    const lesson = STATE.currentLesson;
    if (!mod || !lesson) return buildCourses();

    const lessonIdx = mod.lessons.findIndex(l => l.id === lesson.id);
    const prevLesson = lessonIdx > 0 ? mod.lessons[lessonIdx - 1] : null;
    const nextLesson = lessonIdx < mod.lessons.length - 1 ? mod.lessons[lessonIdx + 1] : null;
    const done = STATE.userData?.progress?.[lesson.id];

    return `
    <div class="player-layout">
      <div class="player-main">
        <div class="player-breadcrumb">
          <span onclick="render('courses')"><i class="ti ti-arrow-left"></i> Cursos</span>
          <i class="ti ti-chevron-right"></i>
          <span>Módulo ${mod.num}</span>
          <i class="ti ti-chevron-right"></i>
          <span>${lesson.title}</span>
        </div>

        <div class="video-container">
          <iframe
            src="https://www.youtube-nocookie.com/embed/${lesson.videoId}?rel=0&modestbranding=1"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <div class="player-controls">
          <button class="btn-ghost ${!prevLesson?'disabled':''}"
            onclick="${prevLesson?`openLesson(${mod.id},'${prevLesson.id}')`:''}">
            <i class="ti ti-arrow-left"></i> Anterior
          </button>
          <button class="btn-primary ${done?'btn-done':''}" onclick="markLesson('${lesson.id}')">
            <i class="ti ${done?'ti-circle-check':'ti-check'}"></i>
            ${done ? "Completada" : "Marcar como completada"}
          </button>
          <button class="btn-ghost ${!nextLesson?'disabled':''}"
            onclick="${nextLesson?`openLesson(${mod.id},'${nextLesson.id}')`:''}">
            Siguiente <i class="ti ti-arrow-right"></i>
          </button>
        </div>

        <div class="lesson-info">
          <h3>${lesson.title}</h3>
          <p class="lesson-meta"><i class="ti ti-clock"></i> ${lesson.duration} · Módulo ${mod.num}: ${mod.title}</p>
        </div>
      </div>

      <div class="player-sidebar">
        <div class="sidebar-title">Módulo ${mod.num} · ${mod.title}</div>
        <div class="sidebar-lessons">
          ${mod.lessons.map(l => {
            const isDone = STATE.userData?.progress?.[l.id];
            const isActive = l.id === lesson.id;
            return `
            <div class="sidebar-lesson ${isActive?'active':''} ${isDone?'done':''}"
                 onclick="openLesson(${mod.id},'${l.id}')">
              <i class="ti ${isDone?'ti-circle-check':'ti-player-play'}"></i>
              <span>${l.title}</span>
              <span class="sl-dur">${l.duration}</span>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>`;
  }

  // ── DASHBOARD ───────────────────────────────────────────────
  function buildDashboard() {
    if (!STATE.user) return buildAuth("login");

    const totalLessons = MODULES.reduce((s,m) => s + m.lessons.length, 0);
    const totalDone    = MODULES.reduce((s,m) => s + m.lessons.filter(l => STATE.userData?.progress?.[l.id]).length, 0);
    const pct          = Math.round(totalDone / totalLessons * 100);
    const planName     = PLANS[STATE.plan]?.name || "Gratis";
    const userName     = STATE.userData?.name || STATE.user.email;

    // Encontrar próxima lección sin ver
    let nextLess = null, nextMod = null;
    outer: for (const mod of MODULES) {
      if (!canAccess(mod.id)) continue;
      for (const l of mod.lessons) {
        if (!STATE.userData?.progress?.[l.id]) { nextLess = l; nextMod = mod; break outer; }
      }
    }

    return `
    <div class="page-header">
      <div>
        <h2>Hola, ${userName.split(" ")[0]} 👋</h2>
        <p class="page-sub">Plan activo: <strong>${planName}</strong></p>
      </div>
      <button class="btn-outline" onclick="render('pricing')">Mejorar plan <i class="ti ti-arrow-up"></i></button>
    </div>

    <div class="dash-metrics">
      <div class="metric-card">
        <i class="ti ti-check-circle metric-icon green"></i>
        <div class="metric-value">${totalDone}</div>
        <div class="metric-label">Lecciones completadas</div>
      </div>
      <div class="metric-card">
        <i class="ti ti-chart-bar metric-icon gold"></i>
        <div class="metric-value">${pct}%</div>
        <div class="metric-label">Progreso general</div>
      </div>
      <div class="metric-card">
        <i class="ti ti-books metric-icon blue"></i>
        <div class="metric-value">${MODULES.filter(m=>canAccess(m.id)).length}</div>
        <div class="metric-label">Módulos desbloqueados</div>
      </div>
      <div class="metric-card">
        <i class="ti ti-star metric-icon gold"></i>
        <div class="metric-value">${planName}</div>
        <div class="metric-label">Tu plan actual</div>
      </div>
    </div>

    ${nextLess ? `
    <div class="continue-card" onclick="openLesson(${nextMod.id},'${nextLess.id}')">
      <div class="continue-left">
        <div class="continue-tag">CONTINÚA DONDE LO DEJASTE</div>
        <div class="continue-title">${nextLess.title}</div>
        <div class="continue-mod">Módulo ${nextMod.num}: ${nextMod.title} · ${nextLess.duration}</div>
      </div>
      <button class="btn-primary"><i class="ti ti-player-play"></i> Continuar</button>
    </div>` : `
    <div class="continue-card completed">
      <div class="continue-left">
        <div class="continue-tag">🎉 LOGRO</div>
        <div class="continue-title">¡Completaste todos los módulos disponibles!</div>
        <div class="continue-mod">Actualiza tu plan para desbloquear más contenido</div>
      </div>
      <button class="btn-primary" onclick="render('pricing')">Ver planes</button>
    </div>`}

    <div id="progress-modules">
      ${buildProgressModules()}
    </div>`;
  }

  function buildProgressModules() {
    return `
    <div class="section-label" style="margin-top:2rem">TUS MÓDULOS</div>
    <div class="progress-modules-grid">
      ${MODULES.map(mod => {
        const locked = !canAccess(mod.id);
        const prog   = moduleProgress(mod);
        const done   = STATE.userData ? mod.lessons.filter(l => STATE.userData.progress?.[l.id]).length : 0;
        return `
        <div class="prog-card ${locked?'locked':''}" onclick="${locked?`render('pricing')`:`render('courses'); setTimeout(()=>toggleModule(${mod.id}),100)`}">
          <div class="pc-header">
            <div class="pc-icon ${locked?'locked':''}"><i class="ti ${locked?'ti-lock':mod.icon}"></i></div>
            <div class="pc-meta">
              <div class="pc-num">MÓDULO ${mod.num}</div>
              <div class="pc-title">${mod.title}</div>
            </div>
          </div>
          ${!locked
            ? `<div class="pc-prog">
                 <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
                 <span>${done}/${mod.lessons.length} · ${prog}%</span>
               </div>`
            : `<div class="pc-locked-msg"><i class="ti ti-lock"></i> Actualiza tu plan para acceder</div>`
          }
        </div>`;
      }).join("")}
    </div>`;
  }

  function renderProgress() {
    const el = document.getElementById("progress-modules");
    if (el) el.innerHTML = buildProgressModules();
  }

  // ── WOMPI CONFIG ─────────────────────────────────────────────
  // Firmas SHA256 pre-generadas con prod_integrity_eVcYQ4G3Xp242eFJX1tQltcVofIFU2Az
  // Referencia · Monto en centavos · COP · SecretoIntegridad → SHA256
  const WOMPI_CONFIG = {
    publicKey: "pub_prod_RkqlliK4m8jiIIlBEYNxCbPZ5oMYmax0",
    redirectUrl: "https://franklinymt-ops.github.io/academia/",
    plans: {
      curso: {
        amountCents: 11900000,           // $119.000 COP
        reference:   "FRANKLIN-CURSO-001",
        integrity:   "b81909742dffb45f658e2895f7ae557675c69e783666720b4ed266d7ff830aaf"
      },
      comunidad: {
        amountCents: 3000000,            // $30.000 COP
        reference:   "FRANKLIN-COM-001",
        integrity:   "b643335187b77eb09f79c71f234f6e1208fbe521cdd8e0551164274003833b5c"
      },
      mentoria: {
        amountCents: 30000000,           // $300.000 COP
        reference:   "FRANKLIN-MEN-001",
        integrity:   "69dbe115748f165cd1d3565c0c1d377be872bf68f9367166f6cc2fa2cd214228"
      }
    }
  };

  // ── PRICING ─────────────────────────────────────────────────
  function buildPricing() {
    const plans = [
      { key:"curso",     badge:"",            price:"$119.000",   period:"COP · pago único",   usd:"≈ USD 28",
        features:["6 módulos completos","30+ lecciones en video","Acceso de por vida","Actualizaciones incluidas"] },
      { key:"comunidad", badge:"MÁS POPULAR", price:"$30.000",    period:"COP / mes",           usd:"≈ USD 7/mes",
        features:["Todo lo del Curso","Comunidad privada Discord","Q&A mensual con Franklin","Plantillas y recursos extra"] },
      { key:"mentoria",  badge:"",            price:"$300.000",   period:"COP / mes",           usd:"≈ USD 70/mes",
        features:["Todo lo de Comunidad","Calls semanales grupales","Revisión de tu negocio","Acceso directo a Franklin"] },
      { key:"empresa",   badge:"",            price:"$1.000.000+",period:"COP · por proyecto",  usd:"≈ USD 240+",
        features:["Implementación completa","IA y automatizaciones","Sistemas a medida","Soporte continuo 1 a 1"] }
    ];

    return `
    <div class="page-header centered">
      <h2>Elige tu Plan</h2>
      <p class="page-sub">Desde el curso grabado hasta implementación empresarial. Sin contratos.</p>
    </div>
    <div class="pricing-grid">
      ${plans.map(p => `
      <div class="price-card ${p.badge?'featured':''}">
        ${p.badge ? `<div class="feat-badge">${p.badge}</div>` : ""}
        <div class="plan-level">${PLANS[p.key].name}</div>
        <div class="plan-price">${p.price}</div>
        <div class="plan-period">${p.period}</div>
        <div class="plan-usd">${p.usd}</div>
        <ul class="plan-features">
          ${p.features.map(f=>`<li><i class="ti ti-check"></i>${f}</li>`).join("")}
        </ul>
        <button class="btn-price ${p.badge?'featured':''}"
          onclick="handlePlanClick('${p.key}')">
          ${STATE.plan===p.key
            ? '<i class="ti ti-circle-check"></i> Plan actual'
            : p.key==='empresa'
              ? '<i class="ti ti-brand-whatsapp"></i> Contactar'
              : 'Pagar con Wompi <i class="ti ti-arrow-right"></i>'
          }
        </button>
      </div>`).join("")}
    </div>
    <div class="pricing-note">
      <i class="ti ti-shield-check"></i>
      Pagos seguros procesados por <strong>Wompi</strong> · Tarjeta, PSE, Nequi, Bancolombia.
      Tu acceso se activa en minutos tras confirmar el pago.
    </div>`;
  }

  function handlePlanClick(planKey) {
    // Sin sesión → registrarse primero
    if (!STATE.user) { render("register"); return; }

    // Plan empresa → WhatsApp directo
    if (planKey === "empresa") {
      const msg = encodeURIComponent(
        `Hola Franklin, soy ${STATE.userData?.name || STATE.user.email} y quiero información sobre el plan de Implementación para mi empresa.`
      );
      window.open(`https://wa.me/TUNUMERO_COLOMBIA?text=${msg}`, "_blank");
      return;
    }

    // Plan ya activo
    if (STATE.plan === planKey) {
      showToast("✅ Ya tienes este plan activo");
      return;
    }

    // Obtener config Wompi del plan
    const wc = WOMPI_CONFIG.plans[planKey];
    if (!wc) return;

    // Construir URL de Web Checkout con datos del usuario prellenados
    const email    = encodeURIComponent(STATE.user.email);
    const nombre   = encodeURIComponent(STATE.userData?.name || "");
    const redirect = encodeURIComponent(WOMPI_CONFIG.redirectUrl);

    const url = `https://checkout.wompi.co/p/` +
      `?public-key=${WOMPI_CONFIG.publicKey}` +
      `&currency=COP` +
      `&amount-in-cents=${wc.amountCents}` +
      `&reference=${wc.reference}` +
      `&signature:integrity=${wc.integrity}` +
      `&redirect-url=${redirect}` +
      `&customer-data:email=${email}` +
      `&customer-data:full-name=${nombre}`;

    // Abrir checkout Wompi en nueva pestaña
    window.open(url, "_blank");

    // Mostrar instrucción al usuario
    showToast("🔒 Completando pago en Wompi... Vuelve aquí cuando termines.");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 5000);
  }

  // ── AUTH ────────────────────────────────────────────────────
  function buildAuth(mode) {
    const isLogin = mode === "login";
    return `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-badge">FM</div>
          <div class="logo-text">Franklin<span>IA & Emprendimientos</span></div>
        </div>
        <h3 class="auth-title">${isLogin ? "Bienvenido de vuelta" : "Crea tu cuenta gratis"}</h3>
        <p class="auth-sub">${isLogin ? "Inicia sesión para continuar tu aprendizaje" : "Accede al Módulo 0 sin costo. Actualiza cuando quieras."}</p>

        <div id="auth-msg" class="auth-msg" style="display:none"></div>

        ${!isLogin ? `
        <div class="form-group">
          <label>Nombre completo</label>
          <input id="auth-name" type="text" placeholder="Tu nombre" />
        </div>` : ""}

        <div class="form-group">
          <label>Correo electrónico</label>
          <input id="auth-email" type="email" placeholder="tu@correo.com" />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input id="auth-pass" type="password" placeholder="Mínimo 6 caracteres" />
        </div>

        <button class="btn-primary btn-full" id="auth-btn"
          onclick="${isLogin ? "doLogin()" : "doRegister()"}">
          ${isLogin ? "Ingresar" : "Crear cuenta"} <i class="ti ti-arrow-right"></i>
        </button>

        <div class="auth-switch">
          ${isLogin
            ? `¿No tienes cuenta? <span onclick="render('register')">Regístrate gratis</span>`
            : `¿Ya tienes cuenta? <span onclick="render('login')">Inicia sesión</span>`
          }
        </div>
      </div>
    </div>`;
  }

  // ── HELPERS ─────────────────────────────────────────────────
  function toggleModule(id) {
    const lessons = document.getElementById(`lessons-${id}`);
    const chev    = document.getElementById(`chev-${id}`);
    if (!lessons) return;
    const open = lessons.style.display === "none";
    lessons.style.display = open ? "block" : "none";
    if (chev) chev.style.transform = open ? "rotate(180deg)" : "";
  }

  function openLesson(modId, lessonId) {
    if (!STATE.user) { render("register"); return; }
    STATE.currentModule = MODULES.find(m => m.id === modId);
    STATE.currentLesson = STATE.currentModule?.lessons.find(l => l.id === lessonId);
    render("player");
  }

  function showUpgradeMsg() {
    showToast("🔒 Esta lección requiere un plan de pago.");
    setTimeout(() => render("pricing"), 2500);
  }

  function goHome() { render("home"); }

  function attachEvents() {
    // Fix auth-msg visibility
    const msg = document.getElementById("auth-msg");
    if (msg && !msg.textContent) msg.style.display = "none";

    // Enter key on auth
    ["auth-email","auth-pass","auth-name"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("keypress", e => {
        if (e.key === "Enter") document.getElementById("auth-btn")?.click();
      });
    });
  }

  // Fix auth-msg display
  const origSetAuthMsg = setAuthMsg;
  window.setAuthMsg = function(msg, type) {
    const el = document.getElementById("auth-msg");
    if (!el) return;
    el.style.display = "block";
    el.textContent = msg;
    el.className = "auth-msg " + type;
  };

  // Expose to global
  window.render       = render;
  window.goHome       = goHome;
  window.toggleModule = toggleModule;
  window.openLesson   = openLesson;
  window.markLesson   = markLesson;
  window.doLogin      = doLogin;
  window.doRegister   = doRegister;
  window.doLogout     = doLogout;
  window.showUpgradeMsg = showUpgradeMsg;
  window.handlePlanClick = handlePlanClick;
</script>

.mod-lessons{border-top:1px solid var(--border);animation:slideDown 0.2s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.lesson-row{display:flex;align-items:center;gap:12px;padding:11px 1.5rem 11px 4rem;cursor:pointer;transition:background 0.15s;border-bottom:0.5px solid var(--border)}
.lesson-row:last-child{border-bottom:none}
.lesson-row:hover{background:#faf8f3}
.lesson-row.locked{cursor:pointer;opacity:0.7}
.lesson-row.done{background:#f0fdf4}
.lesson-icon i{font-size:16px;color:var(--muted);width:20px;text-align:center}
.lesson-row.done .lesson-icon i{color:var(--green)}
.lesson-row.locked .lesson-icon i{color:var(--muted)}
.lesson-title{flex:1;font-size:14px;color:var(--text)}
.lesson-dur{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.lesson-dur i{font-size:12px}

/* ── PLAYER ── */
.player-layout{display:grid;grid-template-columns:1fr 340px;gap:0;min-height:calc(100vh - 62px);align-items:start}
.player-main{padding:1.5rem 2rem;min-width:0}
.player-breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:1.25rem;flex-wrap:wrap}
.player-breadcrumb span{cursor:pointer;transition:color 0.2s}
.player-breadcrumb span:hover{color:var(--navy)}
.player-breadcrumb i{font-size:12px;opacity:0.5}
.video-container{position:relative;padding-bottom:56.25%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%}
.player-controls{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.lesson-info h3{font-size:20px;font-weight:600;color:var(--navy);margin-bottom:0.25rem}
.lesson-meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.player-sidebar{background:var(--card);border-left:1px solid var(--border);padding:1.5rem;height:calc(100vh - 62px);overflow-y:auto;position:sticky;top:62px}
.sidebar-title{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border)}
.sidebar-lesson{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 0.15s;margin-bottom:2px;font-size:13px}
.sidebar-lesson:hover{background:var(--bg)}
.sidebar-lesson.active{background:#fdf3d0;color:var(--navy)}
.sidebar-lesson.done i{color:var(--green)}
.sidebar-lesson i{font-size:14px;color:var(--muted);flex-shrink:0}
.sidebar-lesson span:nth-child(2){flex:1;line-height:1.4}
.sl-dur{font-size:11px;color:var(--muted);white-space:nowrap}

/* ── DASHBOARD ── */
.dash-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;padding:0 3rem;max-width:1200px;margin:0 auto;width:100%}
.metric-card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem;display:flex;flex-direction:column;gap:8px}
.metric-icon{font-size:24px}
.metric-icon.green{color:var(--green)}
.metric-icon.gold{color:var(--gold2)}
.metric-icon.blue{color:var(--blue)}
.metric-value{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--navy);letter-spacing:1px;line-height:1}
.metric-label{font-size:12px;color:var(--muted)}
.continue-card{background:var(--navy);border-radius:12px;padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:1.5rem 3rem;max-width:1134px;cursor:pointer;flex-wrap:wrap}
.continue-tag{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.continue-title{font-size:18px;font-weight:600;color:#fff;margin-bottom:4px}
.continue-mod{font-size:13px;color:rgba(255,255,255,0.55)}
.continue-card.completed{background:var(--bg);border:1px solid var(--border);cursor:default}
.continue-card.completed .continue-title{color:var(--navy)}
.continue-card.completed .continue-mod{color:var(--muted)}
.progress-modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;padding:0 3rem 3rem;max-width:1200px;margin:0 auto}
.prog-card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem;cursor:pointer;transition:all 0.2s}
.prog-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.prog-card.locked{opacity:0.7}
.pc-header{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.pc-icon{width:40px;height:40px;background:var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pc-icon i{color:var(--gold);font-size:18px}
.pc-icon.locked{background:#e8e4d9}
.pc-icon.locked i{color:var(--muted)}
.pc-num{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.pc-title{font-size:14px;font-weight:600;color:var(--navy)}
.pc-prog{display:flex;flex-direction:column;gap:5px}
.pc-prog span{font-size:12px;color:var(--muted)}
.pc-locked-msg{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:0.25rem}

/* ── PRICING ── */
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem;padding:1rem 3rem 2rem;max-width:1200px;margin:0 auto;width:100%}
.price-card{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:2rem 1.5rem;position:relative;transition:all 0.2s}
.price-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.price-card.featured{border:2px solid var(--gold)}
.feat-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy3);font-size:10px;font-weight:700;padding:4px 16px;border-radius:20px;white-space:nowrap;letter-spacing:1px}
.plan-level{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:0.75rem}
.plan-price{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:var(--navy);letter-spacing:1px;line-height:1}
.plan-period{font-size:13px;color:var(--muted);margin-bottom:4px}
.plan-usd{font-size:12px;color:var(--gold2);font-weight:600;margin-bottom:1.5rem}
.plan-features{list-style:none;margin-bottom:1.5rem}
.plan-features li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted);padding:5px 0;border-bottom:0.5px solid var(--border)}
.plan-features li:last-child{border:none}
.plan-features li i{color:var(--gold2);font-size:14px;flex-shrink:0;margin-top:2px}
.btn-price{width:100%;padding:11px;border-radius:8px;font-size:13px;font-weight:600;background:transparent;border:1.5px solid var(--navy);color:var(--navy);display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s}
.btn-price:hover,.btn-price.featured{background:var(--navy);color:#fff}
.pricing-note{text-align:center;font-size:13px;color:var(--muted);padding:1.5rem 3rem 3rem;display:flex;align-items:center;justify-content:center;gap:8px}
.pricing-note i{color:var(--green);font-size:16px}

/* ── AUTH ── */
.auth-wrap{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-card{background:var(--card);border:0.5px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--shadow-md)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem;justify-content:center}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--navy);letter-spacing:2px;text-align:center;margin-bottom:0.4rem}
.auth-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:1.75rem;line-height:1.6}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
.form-group input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border 0.2s;background:#fff;color:var(--text)}
.form-group input:focus{border-color:var(--navy)}
.auth-msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:1rem}
.auth-msg.info{background:#eff6ff;color:#1d4ed8}
.auth-msg.error{background:#fef2f2;color:#dc2626}
.auth-switch{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--muted)}
.auth-switch span{color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline}

/* ── TOAST ── */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy3);color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;z-index:1000;transition:transform 0.3s;white-space:nowrap;box-shadow:var(--shadow-md)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .hero{padding:2.5rem 1.5rem}
  .hero-visual{display:none}
  .player-layout{grid-template-columns:1fr}
  .player-sidebar{display:none}
  .page-header{padding:1.5rem 1.5rem 1rem}
  .modules-list{padding:0 1.5rem 2rem}
  .dash-metrics,.pricing-grid,.progress-modules-grid{padding-left:1.5rem;padding-right:1.5rem}
  .continue-card{margin:1.5rem 1.5rem}
  .section-wrap{padding:2rem 1.5rem}
  nav{padding:0 1rem}
  .nav-links{display:none}
}
</style>
